[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lemonade-a2a"
version = "0.1.0"
description = "A2A protocol adapter for AMD Lemonade"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lemonade A2A contributors" }]
dependencies = [
  "a2a-sdk[fastapi]>=1.2.0,<1.3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "opentelemetry-api>=1.27,<2",
  "packaging>=23",
]

[project.optional-dependencies]
# OpenTelemetry SDK and exporters (the API alone is a core dependency; telemetry is off by default).
otel = [
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
  "opentelemetry-exporter-prometheus>=0.48b0",
  "prometheus-client>=0.20",
]
# Persistent tasks: LEMONADE_A2A_TASK_STORE=sqlite
sqlite = [
  "sqlalchemy[asyncio]>=2",
  "aiosqlite>=0.20",
]
# What the test suite needs (also what the canary installs against other a2a-sdk versions).
test = [
  "lemonade-a2a[otel,sqlite]",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6",
  "cryptography>=43",
  "jsonschema>=4",
  "pyyaml>=6",
]
dev = [
  "lemonade-a2a[test]",
  "pytest-cov>=5",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
  "build>=1",
]

[project.scripts]
lemonade-a2a = "lemonade_a2a.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lemonade_a2a"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: needs a real Lemonade server (opt in with LEMONADE_INTEGRATION=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["src/lemonade_a2a"]
branch = false

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.bandit]
exclude_dirs = ["tests"]
