[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lemonade-a2a"
version = "0.1.0"
description = "A2A protocol adapter for AMD Lemonade"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lemonade A2A contributors" }]
dependencies = [
  "a2a-sdk[fastapi]>=1.2.0,<1.3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
]

[project.scripts]
lemonade-a2a = "lemonade_a2a.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lemonade_a2a"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["src/lemonade_a2a"]
branch = false

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.bandit]
exclude_dirs = ["tests"]
