[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lemonade-a2a"
version = "0.1.0"
description = "A2A protocol adapter for AMD Lemonade"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lemonade A2A contributors" }]
dependencies = [
  "a2a-sdk[fastapi]>=1.2.0,<1.3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
lemonade-a2a = "lemonade_a2a.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lemonade_a2a"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
