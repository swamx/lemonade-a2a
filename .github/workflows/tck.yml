name: TCK

# Opt-in: runs the official A2A TCK (pinned revision) against the protocol surface.
# Not a required check; it runs weekly, on demand, and on PRs that touch the server.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 3"
  pull_request:
    paths:
      - "src/**"
      - "tck/**"
      - "scripts/run_tck.py"
      - "pyproject.toml"
      - ".github/workflows/tck.yml"

permissions:
  contents: read

concurrency:
  group: tck-${{ github.ref }}
  cancel-in-progress: true

env:
  # To move to a newer TCK: change this SHA, run the job, review the diff in results.
  TCK_REF: 263b9cfaf16a554bdfb166a7ba5b67716e946349  # pragma: allowlist secret

jobs:
  tck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: a2aproject/a2a-tck
          ref: ${{ env.TCK_REF }}
          path: a2a-tck
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install adapter and the TCK (its own virtualenv)
        run: |
          python -m pip install --upgrade pip uv
          python -m pip install -e '.[dev]'
          uv venv a2a-tck/.venv
          VIRTUAL_ENV="$PWD/a2a-tck/.venv" uv pip install -e a2a-tck
      - name: Run the TCK (official, unpatched)
        # Fails on any deviation other than the two known TCK artifacts (issue #248).
        run: python scripts/run_tck.py --tck-dir a2a-tck --output tck-results.json
      - name: Run the TCK with the messageId workaround
        # Workaround while a2aproject/a2a-tck#248 is open: the patch gives each follow-up
        # message its own messageId. This run must be completely clean. If the patch stops
        # applying, the TCK changed: re-check the issue and drop or refresh the patch.
        run: >
          python scripts/run_tck.py --tck-dir a2a-tck
          --patch tck/patches/unique-message-ids.patch --output tck-results-patched.json
      - name: Summary
        if: always()
        run: |
          {
            echo "### A2A TCK @ \`${TCK_REF:0:7}\`"
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("tck-results.json")
          if p.exists():
              d = json.loads(p.read_text())
              print(f"Status: **{d['status']}**  \nTest cases: `{d['test_cases']}`  ")
              print(f"Known deviations: {d['known_deviations'] or 'none'}")
          else:
              print("No results file was produced.")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tck-results
          path: |
            tck-results.json
            tck-results-patched.json
            a2a-tck/reports/
          if-no-files-found: ignore
