name: A2A Conformance

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/check_a2a_conformance.py"
      - "pyproject.toml"
      - ".github/workflows/a2a-conformance.yml"
  workflow_dispatch:

jobs:
  protocol-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_protocol_version.py tests/test_agent_card.py tests/test_executor.py

  # The official A2A TCK/ITK jobs are deliberately kept separate from unit
  # tests. They require a live agent plus a deterministic mock Lemonade backend.
  # The next upgrade adds that backend and pins the upstream TCK revision so
  # results remain reproducible rather than silently changing with upstream main.
