name: E2E

on:
  push:
    branches: [main, test/mock-lemonade-e2e]
  pull_request:

permissions:
  contents: read

jobs:
  blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit-level deterministic backend tests
        run: pytest -q tests/test_mock_lemonade_e2e.py
      - name: Start mock Lemonade
        run: |
          python -m uvicorn tests.mock_lemonade:app --host 127.0.0.1 --port 13305 > /tmp/mock-lemonade.log 2>&1 &
          echo $! > /tmp/mock-lemonade.pid
      - name: Start Lemonade A2A
        env:
          LEMONADE_BASE_URL: http://127.0.0.1:13305/v1
          LEMONADE_A2A_PUBLIC_URL: http://127.0.0.1:9100
        run: |
          lemonade-a2a > /tmp/lemonade-a2a.log 2>&1 &
          echo $! > /tmp/lemonade-a2a.pid
      - name: Black-box A2A smoke test
        run: python scripts/blackbox_e2e.py
      - name: Print service logs on failure
        if: failure()
        run: |
          echo '--- Mock Lemonade ---'
          cat /tmp/mock-lemonade.log || true
          echo '--- Lemonade A2A ---'
          cat /tmp/lemonade-a2a.log || true
      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/lemonade-a2a.pid) 2>/dev/null || true
          kill $(cat /tmp/mock-lemonade.pid) 2>/dev/null || true
