name: E2E

on:
  push:
    branches: [main, test/mock-lemonade-e2e]
  pull_request:

jobs:
  mock-lemonade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Deterministic backend tests
        run: pytest -q tests/test_mock_lemonade_e2e.py
